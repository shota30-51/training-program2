<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>トレーニングプログラム記録</title>
  <style>
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
      margin: 0;
      background: white;
      color: #111;
      padding-bottom: 140px;
    }

    .container {
      max-width: 960px;
      margin: auto;
      padding: 30px;
    }

    h1.title {
      background: linear-gradient(to right, #1a237e, #0d47a1);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    /* ===== スプレッドシート同期エリア（左下固定） ===== */
    .drive-section {
      position: fixed;
      bottom: 140px;
      left: 16px;
      background: #f1f8e9;
      border: 1px solid #a5d6a7;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .drive-label {
      font-weight: bold;
      color: #33691e;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .drive-buttons {
      display: flex;
      justify-content: center;
    }

    #driveSaveBtn {
      background: #2e7d32;
      font-size: 14px;
      padding: 10px 18px;
      margin-top: 0;
    }

    #driveStatus {
      font-size: 11px;
      color: #666;
      text-align: center;
      white-space: nowrap;
    }

    /* ===== 既存スタイル ===== */
    .client-info {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .client-info input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .exercise {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      background-color: #f9f9f9;
      position: relative;
    }

    select.body-part,
    select.exercise-name,
    input.body-part-other {
      padding: 8px 12px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin: 5px 5px 5px 0;
      height: 38px;
      vertical-align: middle;
      appearance: none;
      background: white;
    }

    .exercise input[type="number"] {
      padding: 8px;
      font-size: 15px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      height: 38px;
      box-sizing: border-box;
    }

    .set-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    .set-group input {
      flex: 1;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
      background-color: #0d47a1;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #1565c0;
    }

    .remove-btn {
      background-color: #b71c1c;
      margin-left: 10px;
    }

    .remove-btn:hover {
      background-color: #c62828;
    }


    .button-area {
      text-align: center;
    }

    #trainerMemoSection {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #f3f3f3;
      border-top: 2px solid #ccc;
      padding: 8px 10px;
      z-index: 1000;
    }

    #trainerMemoSection textarea {
      width: 100%;
      height: 72px;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      resize: none;
      transition: height 0.3s ease;
      overflow: auto;
      box-sizing: border-box;
      line-height: 1.5;
    }

    #trainerMemoSection textarea:focus {
      height: 160px;
    }

    .max-weight {
      font-size: 14px;
      color: #2e7d32;
      font-weight: bold;
      margin-top: 5px;
    }

    /* =====================================================
       📸 スクリーンショット用ビュー
    ===================================================== */
    #screenshotView {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #f0f4f8;
      z-index: 3000;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .ss-header {
      background: linear-gradient(135deg, #1a237e, #0d47a1);
      color: white;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .ss-header-title {
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .ss-back-btn {
      background: rgba(255,255,255,0.2);
      border: 1px solid rgba(255,255,255,0.4);
      color: white;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      margin: 0;
    }

    .ss-back-btn:hover {
      background: rgba(255,255,255,0.35);
    }

    /* ===== スクリーンショット対象エリア ===== */
    #ssCapture {
      max-width: calc(100% - 48px);
      margin: 20px auto 0 auto;
      padding: 0 0 80px 0;
      transform-origin: top center;
    }

    /* ===== コンテンツ全体をラップする白いカード ===== */
    .ss-content-wrapper {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      min-height: calc(100vh - 160px);
      display: flex;
      flex-direction: column;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    .ss-card-header {
      background: linear-gradient(135deg, #1a237e, #0d47a1);
      color: white;
      border-radius: 12px 12px 0 0;
      padding: 16px 20px;
      text-align: center;
    }

    .ss-card-header h2 {
      margin: 0 0 8px 0;
      font-size: 17px;
      letter-spacing: 1px;
    }

    .ss-client-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      opacity: 0.9;
    }

    .ss-client-name {
      font-size: 16px;
      font-weight: bold;
    }

    .ss-date {
      font-size: 13px;
      opacity: 0.85;
    }

    /* 種目カード */
    .ss-exercise-card {
      background: white;
      border-left: 4px solid #0d47a1;
      border-radius: 0;
      padding: 12px 14px;
      margin: 2px 0;
    }

    .ss-exercise-card:last-of-type {
      border-radius: 0 0 12px 12px;
      margin-bottom: 0;
    }

    .ss-exercise-name {
      font-size: 14px;
      font-weight: bold;
      color: #1a237e;
      margin: 0 0 8px 0;
    }

    .ss-part-badge {
      display: inline-block;
      background: #e8eaf6;
      color: #3949ab;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 10px;
      margin-right: 6px;
      font-weight: normal;
    }

    .ss-sets-grid {
      display: grid;
      gap: 5px;
      margin-top: 6px;
    }

    .ss-set-item {
      background: #f5f7fa;
      border: 1px solid #e0e4ef;
      border-radius: 6px;
      text-align: center;
      overflow: hidden;
    }

    .ss-set-label {
      color: #888;
      display: block;
      margin-bottom: 2px;
    }

    .ss-set-value {
      font-weight: bold;
      color: #1a237e;
    }

    .ss-remarks {
      margin-top: 8px;
      font-size: 12px;
      color: #444;
      background: #f5f5f5;
      border-left: 3px solid #bbb;
      padding: 5px 8px;
      border-radius: 0 4px 4px 0;
      white-space: pre-wrap;
    }

    /* フッター */
    .ss-footer {
      text-align: center;
      font-size: 11px;
      color: #888;
      padding: 32px 12px 24px 12px;
      margin-top: auto;
    }

    /* 下部固定ボタンエリア */
    .ss-bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: white;
      border-top: 1px solid #ddd;
      padding: 10px 16px;
      display: flex;
      gap: 10px;
      justify-content: center;
      z-index: 10;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    }

    .ss-pdf-btn {
      background: #4a148c;
      font-size: 14px;
      padding: 11px 22px;
      border-radius: 8px;
      margin: 0;
    }

    .ss-close-btn {
      background: #546e7a;
      font-size: 14px;
      padding: 11px 22px;
      border-radius: 8px;
      margin: 0;
    }

    /* =====================================================
       📝 タブ切替（トレーニング記録 / カウンセリングシート）
    ===================================================== */
    .tab-nav {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 10px;
      font-size: 15px;
      font-weight: bold;
      background: #e8eaf6;
      color: #1a237e;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 0;
    }

    .tab-btn:hover {
      background: #c5cae9;
    }

    .tab-btn.active {
      background: linear-gradient(to right, #1a237e, #0d47a1);
      color: white;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* ===== カウンセリングシート専用スタイル ===== */
    .counseling-section {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      background-color: #f9f9f9;
    }

    .counseling-section h3 {
      margin: 0 0 14px 0;
      font-size: 16px;
      color: #1a237e;
      border-bottom: 2px solid #e8eaf6;
      padding-bottom: 8px;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 12px;
    }

    .form-field {
      flex: 1;
      min-width: 200px;
    }

    .form-field label {
      display: block;
      font-size: 13px;
      color: #555;
      margin-bottom: 4px;
    }

    .form-field input,
    .form-field select,
    .form-field textarea {
      width: 100%;
      padding: 8px 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
    }

    .form-field textarea {
      height: 70px;
      resize: vertical;
    }

    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      font-weight: normal;
      color: #333;
    }

    .checkbox-label input {
      width: auto;
    }

    .birth-select-group {
      display: flex;
      gap: 8px;
    }

    .birth-select-group select {
      width: auto;
      flex: 1;
    }
  </style>
</head>
<body>
  <div class="container" id="mainContainer">
    <h1 class="title">トレーニングプログラム記録</h1>

    <div class="tab-nav">
      <button type="button" class="tab-btn active" id="tabBtnTraining" onclick="switchTab('training')">📋 トレーニング記録</button>
      <button type="button" class="tab-btn" id="tabBtnCounseling" onclick="switchTab('counseling')">📝 カウンセリングシート</button>
    </div>

    <div id="trainingTab" class="tab-content active">
      <div class="client-info">
        <input type="text" id="clientName" placeholder="クライアント名">
        <input type="date" id="trainingDate">
      </div>
      <div id="exercises"></div>
      <div class="button-area">
        <button onclick="addExercise(); autoSaveForm();">種目を追加</button>
      </div>
    </div>

    <div id="counselingTab" class="tab-content">
      <div class="counseling-section">
        <h3>基本情報</h3>
        <div class="form-row">
          <div class="form-field">
            <label>氏名</label>
            <input type="text" id="cName" placeholder="山田 太郎">
          </div>
          <div class="form-field">
            <label>実施日</label>
            <input type="date" id="cDate">
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>生年月日</label>
            <div class="birth-select-group">
              <select id="cBirthYear"><option value="">年</option></select>
              <select id="cBirthMonth"><option value="">月</option></select>
              <select id="cBirthDay"><option value="">日</option></select>
            </div>
          </div>
          <div class="form-field">
            <label>年齢</label>
            <input type="number" id="cAge" placeholder="例：30">
          </div>
          <div class="form-field">
            <label>性別</label>
            <select id="cGender">
              <option value="">選択してください</option>
              <option value="男性">男性</option>
              <option value="女性">女性</option>
              <option value="その他">その他</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>どうやってNUDEを知っていただきましたか？</label>
            <select id="cReferral">
              <option value="">選択してください</option>
              <option value="Instagram">Instagram</option>
              <option value="Instagram広告">Instagram広告</option>
              <option value="Google検索・口コミ">Google検索・口コミ</option>
              <option value="知人の紹介">知人の紹介</option>
              <option value="チラシ">チラシ</option>
              <option value="前を通って気になった">前を通って気になった</option>
              <option value="HPを見た">HPを見た</option>
              <option value="その他">その他</option>
            </select>
            <input type="text" id="cReferralOther" placeholder="自由入力" style="display:none;margin-top:6px;">
          </div>
        </div>
      </div>

      <div class="counseling-section">
        <h3>身体情報</h3>
        <div class="form-row">
          <div class="form-field">
            <label>身長 (cm)</label>
            <input type="number" step="0.1" id="cHeight">
          </div>
          <div class="form-field">
            <label>体重 (kg)</label>
            <input type="number" step="0.1" id="cWeight">
          </div>
        </div>
        <div class="form-field">
          <label>姿勢</label>
          <textarea id="cPosture" placeholder="例：猫背、巻き肩、反り腰 など"></textarea>
        </div>
        <div class="form-field">
          <label>既往歴・怪我の有無</label>
          <textarea id="cMedicalHistory" placeholder="持病、手術歴、現在治療中の怪我など"></textarea>
        </div>
      </div>

      <div class="counseling-section">
        <h3>目標・要望</h3>
        <div class="form-field" style="margin-bottom:12px;">
          <label>トレーニングの目的（複数選択可）</label>
          <div class="checkbox-group" id="cPurposeGroup">
            <label class="checkbox-label"><input type="checkbox" value="ダイエット・減量">ダイエット・減量</label>
            <label class="checkbox-label"><input type="checkbox" value="筋力アップ">筋力アップ</label>
            <label class="checkbox-label"><input type="checkbox" value="健康維持・改善">健康維持・改善</label>
            <label class="checkbox-label"><input type="checkbox" value="姿勢改善">姿勢改善</label>
            <label class="checkbox-label"><input type="checkbox" value="リハビリ">リハビリ</label>
            <label class="checkbox-label"><input type="checkbox" value="大会・イベント対策">大会・イベント対策</label>
          </div>
        </div>
        <div class="form-row">
          <div class="form-field">
            <label>希望頻度</label>
            <input type="text" id="cFrequency" placeholder="例：週2回">
          </div>
          <div class="form-field">
            <label>食事管理を頑張れそうか</label>
            <select id="cDietWillingness">
              <option value="">選択してください</option>
              <option value="頑張れそう">頑張れそう</option>
              <option value="どちらとも言えない">どちらとも言えない</option>
              <option value="難しそう">難しそう</option>
            </select>
          </div>
        </div>
        <div class="form-field" style="margin-bottom:12px;">
          <label>食事内容（メモ）</label>
          <textarea id="cDietNotes" placeholder="普段の食事内容や状況など"></textarea>
        </div>
        <div class="form-field" style="margin-bottom:12px;">
          <label>なりたい姿・目標</label>
          <textarea id="cGoal" placeholder="具体的な目標（例：3ヶ月で-5kg、腹筋を割りたい など）"></textarea>
        </div>
        <div class="form-field">
          <label>その他要望・備考</label>
          <textarea id="cNotes" placeholder="その他伝えておきたいこと"></textarea>
        </div>
      </div>

      <div class="button-area">
        <button id="counselingViewModeBtn">表示モード（別タブ）</button>
      </div>
    </div>

    <!-- ===== スプレッドシート同期バー ===== -->
    <div class="drive-section">
      <span class="drive-label" id="driveLabel">スプレッドシート同期</span>
      <div class="drive-buttons">
        <button id="driveSaveBtn" onclick="handleSaveClick()">保存</button>
      </div>
      <span id="driveStatus">待機中</span>
    </div>
  </div>

  <div id="trainerMemoSection">
    <strong>トレーナー用メモ欄</strong>
    <textarea id="trainerMemo" placeholder="次回に引き継ぐメモを入力してください"></textarea>
  </div>

  <!-- =====================================================
       📸 スクリーンショット用ビュー（保存後に表示）
  ===================================================== -->
  <div id="screenshotView">
    <div class="ss-header">
      <button class="ss-back-btn" onclick="closeScreenshotView()">← 戻る</button>
      <span class="ss-header-title">📸 スクリーンショット用</span>
      <div style="width:70px;"></div>
    </div>

    <div id="ssCapture">
      <!-- JS で動的に生成 -->
    </div>

    <div class="ss-bottom-bar">
      <button class="ss-pdf-btn" onclick="savePdfFromScreenshot()">📄 PDF保存</button>
      <button class="ss-close-btn" onclick="closeScreenshotView()">✕ 閉じる</button>
    </div>
  </div>

  <script>
    // =====================================================
    // ⚙️ Apps Script URL（デプロイ済み）
    // =====================================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzqly2OdgCmXrex1XS5ThTPgRIRQaVGNlSQAe3XXXTnQAh-lahSAvHxANMxfny380Dzcg/exec';

    // =====================================================
    // 🔧 名前正規化（スペース除去で統一キーを生成）
    // =====================================================
    function normalizeKey(name) {
      return name.replace(/[\s　]+/g, '');
    }

    let memoSaveTimer = null;

    // =====================================================
    // 🔄 localStorage既存データの移行（旧スペース有キー → 正規化キー）
    // =====================================================
    if (!localStorage.getItem('__keysMigrated')) {
      const keysToMigrate = [];
      for (let i = 0; i < localStorage.length; i++) {
        keysToMigrate.push(localStorage.key(i));
      }
      keysToMigrate.forEach(function(key) {
        if (key.startsWith('record_')) {
          const rest = key.substring(7);
          const lastUnderscore = rest.lastIndexOf('_');
          if (lastUnderscore > 0) {
            const clientPart = rest.substring(0, lastUnderscore);
            const exercisePart = rest.substring(lastUnderscore + 1);
            const normalizedClient = normalizeKey(clientPart);
            const newKey = 'record_' + normalizedClient + '_' + exercisePart;
            if (newKey !== key) {
              const oldVal = parseFloat(localStorage.getItem(key));
              const newVal = parseFloat(localStorage.getItem(newKey));
              if (!newVal || oldVal > newVal) {
                localStorage.setItem(newKey, localStorage.getItem(key));
              }
              localStorage.removeItem(key);
            }
          }
        }
        if (key.startsWith('memo_')) {
          const clientPart = key.substring(5);
          const normalizedClient = normalizeKey(clientPart);
          const newKey = 'memo_' + normalizedClient;
          if (newKey !== key) {
            const oldVal = localStorage.getItem(key) || '';
            const newVal = localStorage.getItem(newKey) || '';
            if (newVal && oldVal && newVal !== oldVal) {
              localStorage.setItem(newKey, newVal + '\n' + oldVal);
            } else if (oldVal) {
              localStorage.setItem(newKey, oldVal);
            }
            localStorage.removeItem(key);
          }
        }
      });
      localStorage.setItem('__keysMigrated', '1');
    }

    // =====================================================
    // PDF表示モード判定（?mode=pdf で別タブから起動）
    // =====================================================
    const PDF_MODE = new URLSearchParams(location.search).get('mode') === 'pdf';

    // === 表示用HTML生成（PDF・スクリーンショット共通） ===
    function buildDisplayBody(clientName, date, exercisesData) {
      var f = 'font-family:Helvetica,Arial,sans-serif;box-sizing:border-box;';
      var body = '';
      body += '<h1 style="text-align:center;background:#1a237e;color:white;padding:10px;border-radius:6px;font-size:18px;margin:0 0 12px 0;' + f + '">トレーニングプログラム記録</h1>';
      body += '<table style="width:100%;margin-bottom:12px;font-size:13px;' + f + '">';
      body += '<tr><td>クライアント名：' + (clientName ? clientName + ' 様' : '') + '</td>';
      body += '<td style="text-align:right;">日付：' + (date || '') + '</td></tr>';
      body += '</table>';
      exercisesData.forEach(function(ex) {
        body += '<div style="border:1px solid #bbb;padding:8px 10px;border-radius:6px;margin-bottom:8px;background:#f9f9f9;page-break-inside:avoid;break-inside:avoid;' + f + '">';
        body += '<p style="font-weight:bold;margin:0 0 4px 0;font-size:13px;">' + ex.part + '：' + ex.name + '</p>';
        (ex.sets || []).forEach(function(s, i) {
          var w = parseFloat(s.weight);
          body += '<p style="margin:2px 0 2px 10px;font-size:12px;">セット' + (i + 1) + '：' + (isNaN(w) ? '-' : w) + 'kg × ' + (s.reps || '-') + '回</p>';
        });
        if (ex.remarks) {
          body += '<p style="color:#c62828;font-size:11px;margin:4px 0 0 0;white-space:pre-wrap;">備考：' + ex.remarks + '</p>';

    // =====================================================
    // 📸 スクリーンショット用ビューを表示
    // =====================================================
    function showScreenshotView(clientName, date, exercisesData) {
      const view   = document.getElementById('screenshotView');
      const capture = document.getElementById('ssCapture');

      // ヘッダーカード（クライアント名・日付）
      let html = '';
      html += '<div class="ss-content-wrapper">';
      html += '<div class="ss-card-header">';
      html += '<h2>トレーニングプログラム</h2>';
      html += '<div class="ss-client-row">';
      html += '<span class="ss-client-name">' + (clientName || '') + ' 様</span>';
      html += '<span class="ss-date">' + (date || '') + '</span>';
      html += '</div>';
      html += '</div>';

      // 種目カード
      exercisesData.forEach(function(ex, idx) {
        const isLast = idx === exercisesData.length - 1;
        html += '<div class="ss-exercise-card' + (isLast ? ' last' : '') + '" style="' + (isLast ? 'border-radius:0 0 12px 12px;' : '') + '">';
        html += '<p class="ss-exercise-name"><span class="ss-part-badge">' + ex.part + '</span>' + ex.name + '</p>';
        // セットグリッド（セット数に応じてフォントサイズ・列数を自動調整）
        if (ex.sets && ex.sets.length > 0) {
          const n = ex.sets.length;
          // セット数に応じてフォントサイズを計算
          const valSize  = Math.max(11, 24 - n * 2);   // 1→22px, 4→16px, 7→11px
          const lblSize  = Math.max(8,  14 - n);        // 1→13px, 4→10px, 7→8px
          const repSize  = Math.max(8,  valSize - 3);   // ×回 はvalよりやや小さく
          const padV     = n <= 3 ? 8 : n <= 5 ? 6 : 4;
          const padH     = n <= 3 ? 10 : n <= 5 ? 7 : 5;
          html += '<div class="ss-sets-grid" style="grid-template-columns:repeat(' + n + ',1fr);">';
          ex.sets.forEach(function(s, i) {
            const w = parseFloat(s.weight);
            html += '<div class="ss-set-item" style="padding:' + padV + 'px ' + padH + 'px;">';
            html += '<span class="ss-set-label" style="font-size:' + lblSize + 'px;">セット' + (i + 1) + '</span>';
            html += '<span class="ss-set-value" style="font-size:' + valSize + 'px;">' + (isNaN(w) ? '–' : w) + 'kg</span>';
            html += '<span style="display:block;font-size:' + repSize + 'px;color:#555;">× ' + (s.reps || '–') + '回</span>';
            html += '</div>';
          });
          html += '</div>';
        }
        if (ex.remarks) {
          html += '<div class="ss-remarks">📝 ' + ex.remarks + '</div>';
        }
        html += '</div>';
      });

      // フッター
      html += '<div class="ss-footer">作成日：' + new Date().toLocaleDateString('ja-JP') + '</div>';
      html += '</div>'; // ss-content-wrapper

      capture.innerHTML = html;
      capture.style.transform = 'scale(1)';
      view.style.display = 'block';
      view.scrollTop = 0;
      document.body.style.overflow = 'hidden';

      // コンテンツが画面に収まらない場合は自動縮小
      requestAnimationFrame(function() {
        const headerH   = document.querySelector('.ss-header').offsetHeight;
        const bottomH   = document.querySelector('.ss-bottom-bar').offsetHeight;
        const available = window.innerHeight - headerH - bottomH - 32; // 余白32px
        const contentH  = capture.scrollHeight;
        if (contentH > available) {
          const scale = Math.max(0.5, available / contentH);
          capture.style.transform = 'scale(' + scale + ')';
          capture.style.marginTop = '16px';
        }
      });
    }

    function closeScreenshotView() {
      document.getElementById('screenshotView').style.display = 'none';
      document.body.style.overflow = '';
    }

    // ✅ メモをスプレッドシートに保存（デバウンス2秒）
    function scheduleMemoSave(clientName, memo) {
      clearTimeout(memoSaveTimer);
      document.getElementById('driveStatus').textContent = '...自動保存準備中';
      memoSaveTimer = setTimeout(async () => {
        await postToServer({ action: 'saveMemo', clientName: normalizeKey(clientName), memo });
      }, 2000);
    }

    // ✅ トレーニング記録の「クライアント名」とカウンセリングシートの「氏名」が
    //   一致しているか確認する。片方が未入力なら問題なし。両方入力済みで
    //   名前が異なる場合はエラーを表示して保存をブロックする（Driveの保存先
    //   フォルダをクライアント名で検索する仕様のため、名前がズレると誤った
    //   フォルダ・別人のデータとして扱われてしまうのを防ぐ）
    function checkNameMatch() {
      const trainingName   = document.getElementById('clientName').value.trim();
      const counselingName = document.getElementById('cName').value.trim();
      if (!trainingName || !counselingName) return true;
      if (normalizeKey(trainingName) === normalizeKey(counselingName)) return true;

      document.getElementById('driveStatus').textContent =
        `⚠️ 名前が一致しません（トレーニング記録：${trainingName} / カウンセリング：${counselingName}）。同じ方の場合は名前を揃えてください`;
      return false;
    }

    // ✅ 手動「保存」ボタン：スプシ保存 → スクリーンショットビュー表示
    async function saveToServer() {
      const clientName = document.getElementById('clientName').value.trim();
      const date       = document.getElementById('trainingDate').value;
      const memo       = document.getElementById('trainerMemo').value;

      if (!clientName) {
        document.getElementById('driveStatus').textContent = '⚠️ クライアント名を入力してください';
        return;
      }
      if (!date) {
        document.getElementById('driveStatus').textContent = '⚠️ 日付を選択してください';
        return;
      }
      if (!checkNameMatch()) {
        return;
      }

      // データ収集・最高重量更新・localStorage書き込み
      const exercisesData = collectExercises();
      updateMaxWeights(clientName, exercisesData);
      const displayBody = buildDisplayBody(clientName, date, exercisesData);
      localStorage.setItem('__pdfData', JSON.stringify({
        type: 'training', clientName, date, displayBody, scriptURL: SCRIPT_URL
      }));

      // ★ スクリーンショット用ビューを表示（新タブではなく同ページ内）
      showScreenshotView(clientName, date, exercisesData);

      document.getElementById('driveStatus').textContent = '💾 スプシに保存中...';

      // メモをスプシに保存
      let memoOk = true;
      if (memo) {
        memoOk = await postToServer({ action: 'saveMemo', clientName: normalizeKey(clientName), memo });
      }
      // 種目データをスプシに保存
      let trainingOk = true;
      if (exercisesData.length > 0) {
        trainingOk = await postToServer({ action: 'saveTraining', date, clientName: normalizeKey(clientName), exercises: exercisesData });
      }

      // ★ 保存が実際に成功したことを確認できた場合のみ、端末側の下書きを消す
      if (memoOk && trainingOk) {
        document.getElementById('driveStatus').textContent = '✅ 保存成功';
        setTimeout(() => { document.getElementById('driveStatus').textContent = '待機中'; }, 5000);
        localStorage.removeItem('__formData');
      } else {
        document.getElementById('driveStatus').textContent = '❌ 保存に失敗しました（入力内容はこの端末に残っています。もう一度「保存」を押してください）';
      }
    }

    // ✅ 種目の最高重量をlocalStorageに記録 + スプレッドシートにも同期
    function updateMaxWeights(clientName, exercisesData) {
      const normalized = normalizeKey(clientName);
      const weightsToSync = [];
      exercisesData.forEach(function(ex) {
        const weights = (ex.sets || []).map(function(s) { return parseFloat(s.weight); }).filter(function(w) { return !isNaN(w); });
        if (weights.length > 0 && normalized && ex.name) {
          const maxWeight = Math.max.apply(null, weights);
          const key  = 'record_' + normalized + '_' + ex.name;
          const prev = parseFloat(localStorage.getItem(key));
          if (!prev || maxWeight > prev) {
            localStorage.setItem(key, maxWeight);
            weightsToSync.push({ exercise: ex.name, weight: maxWeight });
          }
        }
      });
      if (weightsToSync.length > 0) {
        fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ action: 'saveWeights', clientName: normalized, weights: weightsToSync })
        }).catch(err => console.error('Weight save error:', err));
      }
    }

    // ✅ 共通送信関数
    // ★ 以前は mode:'no-cors' で送信結果を確認せずに「成功」扱いしていたため、
    //   サーバー側でエラーが起きていても気づけず、端末の下書きだけが消えるという事故があった。
    //   loadFromServer() と同じ通常のfetchでレスポンスを読み取り、実際の成否をtrue/falseで返す。
    async function postToServer(payload) {
      try {
        const url = SCRIPT_URL + '?payload=' + encodeURIComponent(JSON.stringify(payload));
        const res = await fetch(url);
        const data = await res.json();
        const ok = !!(data && data.status === 'ok');
        const now = new Date().toLocaleTimeString('ja-JP');
        document.getElementById('driveStatus').textContent = ok
          ? `✅ 保存成功 ${now}`
          : `❌ 保存失敗（サーバー応答: ${(data && data.status) || '不明'}）`;
        if (ok) {
          setTimeout(() => { document.getElementById('driveStatus').textContent = '待機中'; }, 5000);
        }
        return ok;
      } catch(err) {
        console.error('Save error:', err);
        document.getElementById('driveStatus').textContent = '❌ 保存失敗（通信エラー）';
        return false;
      }
    }

    // ✅ スプレッドシートからデータ読み込み
    let serverDataCache = null;

    async function loadFromServer() {
      document.getElementById('driveStatus').textContent = '📂 読み込み中...';
      try {
        const res  = await fetch(SCRIPT_URL);
        const data = await res.json();
        serverDataCache = data;

        let count = 0;
        Object.entries(data.memos || {}).forEach(([k, v]) => {
          if (k.startsWith('memo_')) {
            const normalizedKey = 'memo_' + normalizeKey(k.substring(5));
            if (v) localStorage.setItem(normalizedKey, v);
          }
          count++;
        });

        Object.entries(data.weights || {}).forEach(([k, v]) => {
          if (k.startsWith('record_')) {
            const rest = k.substring(7);
            const lastU = rest.lastIndexOf('_');
            if (lastU > 0) {
              const normalizedKey = 'record_' + normalizeKey(rest.substring(0, lastU)) + '_' + rest.substring(lastU + 1);
              const prev = parseFloat(localStorage.getItem(normalizedKey));
              const curr = parseFloat(v);
              if (!prev || curr > prev) localStorage.setItem(normalizedKey, v);
            }
          }
          count++;
        });

        const now = new Date().toLocaleTimeString('ja-JP');
        document.getElementById('driveStatus').textContent = `✅ ${count}件読み込み完了 ${now}`;
        setTimeout(() => { document.getElementById('driveStatus').textContent = '待機中'; }, 5000);

        const clientName = document.getElementById('clientName').value.trim();
        if (clientName) {
          document.getElementById('trainerMemo').value =
            localStorage.getItem('memo_' + normalizeKey(clientName)) || '';

          // 読み込み完了後、表示中の種目の過去最高重量を再表示（タイミング競合の修正）
          document.querySelectorAll('.exercise').forEach(function(ex) {
            const sel = ex.querySelector('.exercise-name');
            const disp = ex.querySelector('.max-weight');
            if (sel && sel.value && disp) {
              const key = 'record_' + normalizeKey(clientName) + '_' + sel.value;
              const w = localStorage.getItem(key);
              disp.textContent = w ? '過去最高重量：' + w + ' kg' : '過去記録なし';
            }
          });
        }
      } catch(err) {
        console.error('Load error:', err);
        document.getElementById('driveStatus').textContent = '❌ 読み込み失敗';
      }
    }

    // ✅ 画面上の種目データを収集
    function collectExercises() {
      const result = [];
      document.querySelectorAll('.exercise').forEach(ex => {
        const part         = ex.querySelector('.body-part').value;
        const partOther    = ex.querySelector('.body-part-other');
        const partName     = part === 'その他' ? partOther.value : part;
        const exerciseNameInput = ex.querySelector('.exercise-name-other');
        const exerciseName = part === 'その他' ? (exerciseNameInput ? exerciseNameInput.value : '') : ex.querySelector('.exercise-name').value;
        const remarks      = ex.querySelector('textarea[placeholder="備考"]').value;
        const setsData     = [];

        ex.querySelectorAll('.set-group').forEach(s => {
          setsData.push({
            weight: s.querySelector('input[placeholder="重量(kg)"]').value,
            reps:   s.querySelector('input[placeholder="回数"]').value
          });
        });

        if (partName && exerciseName) {
          result.push({ part: partName, name: exerciseName, remarks, sets: setsData });
        }
      });
      return result;
    }

    function addSet(button) {
      const setsContainer = button.previousElementSibling;
      const newSet = document.createElement('div');
      newSet.className = 'set-group';
      newSet.innerHTML = `
        <input type="number" step="0.1" placeholder="重量(kg)">
        <input type="number" step="1" placeholder="回数">
        <button class="remove-btn" onclick="removeSet(this)">セット削除</button>
      `;
      setsContainer.appendChild(newSet);
    }

    function removeExercise(button) { button.closest('.exercise').remove(); autoSaveForm(); }
    function removeSet(button)      { button.closest('.set-group').remove(); autoSaveForm(); }

    // =====================================================
    // 🔄 フォーム自動保存・復元
    // =====================================================
    let autoSaveTimer = null;
    function autoSaveForm() {
      clearTimeout(autoSaveTimer);
      autoSaveTimer = setTimeout(function() {
        const formData = {
          clientName: document.getElementById('clientName').value,
          date: document.getElementById('trainingDate').value,
          memo: document.getElementById('trainerMemo').value,
          exercises: []
        };
        document.querySelectorAll('.exercise').forEach(function(ex) {
          const part = ex.querySelector('.body-part').value;
          const partOther = ex.querySelector('.body-part-other') ? ex.querySelector('.body-part-other').value : '';
          const exerciseName = ex.querySelector('.exercise-name').value;
          const exerciseOther = ex.querySelector('.exercise-name-other') ? ex.querySelector('.exercise-name-other').value : '';
          const remarks = ex.querySelector('textarea[placeholder="備考"]').value;
          const sets = [];
          ex.querySelectorAll('.set-group').forEach(function(s) {
            sets.push({
              weight: s.querySelector('input[placeholder="重量(kg)"]').value,
              reps: s.querySelector('input[placeholder="回数"]').value
            });
          });
          formData.exercises.push({ part, partOther, exerciseName, exerciseOther, remarks, sets });
        });
        localStorage.setItem('__formData', JSON.stringify(formData));
      }, 500);
    }

    function restoreForm() {
      const raw = localStorage.getItem('__formData');
      if (!raw) return false;
      try {
        const formData = JSON.parse(raw);
        document.getElementById('clientName').value = formData.clientName || '';
        document.getElementById('trainingDate').value = formData.date || '';
        document.getElementById('trainerMemo').value = formData.memo || '';

        const exercises = formData.exercises || [];
        if (exercises.length === 0) return false;

        exercises.forEach(function(exData) {
          addExercise();
          const exElements = document.querySelectorAll('.exercise');
          const ex = exElements[exElements.length - 1];

          const bodyPartSelect = ex.querySelector('.body-part');
          if (exData.part) {
            bodyPartSelect.value = exData.part;
            bodyPartSelect.dispatchEvent(new Event('change'));
          }
          if (exData.part === 'その他') {
            const bpInput = ex.querySelector('.body-part-other');
            if (bpInput) bpInput.value = exData.partOther || '';
            const exInput = ex.querySelector('.exercise-name-other');
            if (exInput) exInput.value = exData.exerciseOther || '';
          } else if (exData.exerciseName) {
            const exerciseSelect = ex.querySelector('.exercise-name');
            exerciseSelect.value = exData.exerciseName;
            exerciseSelect.dispatchEvent(new Event('change'));
          }

          const remarksEl = ex.querySelector('textarea[placeholder="備考"]');
          if (remarksEl) remarksEl.value = exData.remarks || '';

          const setsDiv = ex.querySelector('.sets');
          (exData.sets || []).forEach(function(setData, idx) {
            if (idx > 0) {
              const newSet = document.createElement('div');
              newSet.className = 'set-group';
              newSet.innerHTML = '<input type="number" step="0.1" placeholder="重量(kg)">' +
                '<input type="number" step="1" placeholder="回数">' +
                '<button class="remove-btn" onclick="removeSet(this)">セット削除</button>';
              setsDiv.appendChild(newSet);
            }
            const setGroups = setsDiv.querySelectorAll('.set-group');
            const sg = setGroups[idx];
            if (sg) {
              sg.querySelector('input[placeholder="重量(kg)"]').value = setData.weight || '';
              sg.querySelector('input[placeholder="回数"]').value = setData.reps || '';
            }
          });
        });
        return true;
      } catch(e) {
        console.error('Form restore error:', e);
        return false;
      }
    }

    // 📝 カウンセリングシート：生年月日プルダウンの選択肢を生成

    function initBirthSelects() {
      const yearSel  = document.getElementById('cBirthYear');
      const monthSel = document.getElementById('cBirthMonth');
      const daySel   = document.getElementById('cBirthDay');
      const thisYear = new Date().getFullYear();

      for (let y = thisYear; y >= thisYear - 100; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = y + '年';
        yearSel.appendChild(opt);
      }
      for (let m = 1; m <= 12; m++) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m + '月';
        monthSel.appendChild(opt);
      }
      for (let d = 1; d <= 31; d++) {
        const opt = document.createElement('option');
        opt.value = d;
        opt.textContent = d + '日';
        daySel.appendChild(opt);
      }
    }

    // =====================================================
    // 📝 カウンセリングシート：データ収集
    // =====================================================
    const REFERRAL_FIXED_OPTIONS = ['Instagram', 'Instagram広告', 'Google検索・口コミ', '知人の紹介', 'チラシ', '前を通って気になった', 'HPを見た'];

    function collectCounseling() {
      const purposes = Array.from(document.querySelectorAll('#cPurposeGroup input:checked')).map(el => el.value);
      const by = document.getElementById('cBirthYear').value;
      const bm = document.getElementById('cBirthMonth').value;
      const bd = document.getElementById('cBirthDay').value;
      const birth = (by && bm && bd)
        ? by + '-' + String(bm).padStart(2, '0') + '-' + String(bd).padStart(2, '0')
        : '';
      const referralSelect = document.getElementById('cReferral').value;
      const referral = referralSelect === 'その他'
        ? document.getElementById('cReferralOther').value.trim()
        : referralSelect;
      return {
        name: document.getElementById('cName').value.trim(),
        birth: birth,
        age: document.getElementById('cAge').value,
        gender: document.getElementById('cGender').value,
        referral: referral,
        date: document.getElementById('cDate').value,
        height: document.getElementById('cHeight').value,
        weight: document.getElementById('cWeight').value,
        posture: document.getElementById('cPosture').value.trim(),
        medicalHistory: document.getElementById('cMedicalHistory').value.trim(),
        purposes: purposes,
        frequency: document.getElementById('cFrequency').value.trim(),
        dietWillingness: document.getElementById('cDietWillingness').value,
        dietNotes: document.getElementById('cDietNotes').value.trim(),
        goal: document.getElementById('cGoal').value.trim(),
        notes: document.getElementById('cNotes').value.trim()
      };
    }

    function applyCounseling(data) {
      if (!data) return;
      document.getElementById('cName').value = data.name || '';
      const birthParts = (data.birth || '').split('-');
      document.getElementById('cBirthYear').value  = birthParts[0] || '';
      document.getElementById('cBirthMonth').value = birthParts[1] ? String(parseInt(birthParts[1], 10)) : '';
      document.getElementById('cBirthDay').value   = birthParts[2] ? String(parseInt(birthParts[2], 10)) : '';
      document.getElementById('cAge').value = data.age || '';
      document.getElementById('cGender').value = data.gender || '';
      const referral = data.referral || '';
      const cReferralOther = document.getElementById('cReferralOther');
      if (referral && REFERRAL_FIXED_OPTIONS.indexOf(referral) === -1) {
        document.getElementById('cReferral').value = 'その他';
        cReferralOther.value = referral;
        cReferralOther.style.display = 'block';
      } else {
        document.getElementById('cReferral').value = referral;
        cReferralOther.value = '';
        cReferralOther.style.display = 'none';
      }
      document.getElementById('cDate').value = data.date || '';
      document.getElementById('cHeight').value = data.height || '';
      document.getElementById('cWeight').value = data.weight || '';
      document.getElementById('cPosture').value = data.posture || '';
      document.getElementById('cMedicalHistory').value = data.medicalHistory || '';
      document.getElementById('cFrequency').value = data.frequency || '';
      document.getElementById('cDietWillingness').value = data.dietWillingness || '';
      document.getElementById('cDietNotes').value = data.dietNotes || '';
      document.getElementById('cGoal').value = data.goal || '';
      document.getElementById('cNotes').value = data.notes || '';
      const purposes = data.purposes || [];
      document.querySelectorAll('#cPurposeGroup input').forEach(el => {
        el.checked = purposes.indexOf(el.value) !== -1;
      });
    }

    // =====================================================
    // 📝 カウンセリングシート：表示用HTML生成（PDF共通）
    // =====================================================
    function buildCounselingDisplayBody(data) {
      var f = 'font-family:Helvetica,Arial,sans-serif;box-sizing:border-box;';
      var row = function(label, value) {
        if (!value) return '';
        return '<tr><td style="padding:4px 8px;color:#666;white-space:nowrap;vertical-align:top;">' + label + '</td>' +
               '<td style="padding:4px 8px;white-space:pre-wrap;">' + value + '</td></tr>';
      };
      var section = function(title, rowsHtml) {
        if (!rowsHtml) return '';
        return '<div style="border:1px solid #bbb;padding:8px 10px;border-radius:6px;margin-bottom:8px;background:#f9f9f9;page-break-inside:avoid;break-inside:avoid;' + f + '">' +
               '<p style="font-weight:bold;margin:0 0 4px 0;font-size:13px;color:#1a237e;">' + title + '</p>' +
               '<table style="width:100%;font-size:12px;' + f + '">' + rowsHtml + '</table></div>';
      };

      var body = '';
      body += '<h1 style="text-align:center;background:#1a237e;color:white;padding:10px;border-radius:6px;font-size:18px;margin:0 0 12px 0;' + f + '">カウンセリングシート</h1>';
      body += '<table style="width:100%;margin-bottom:12px;font-size:13px;' + f + '">';
      body += '<tr><td>氏名：' + (data.name ? data.name + ' 様' : '') + '</td>';
      body += '<td style="text-align:right;">実施日：' + (data.date || '') + '</td></tr>';
      body += '</table>';

      body += section('基本情報',
        row('生年月日', data.birth) +
        row('年齢', data.age ? data.age + ' 歳' : '') +
        row('性別', data.gender) +
        row('流入経路', data.referral)
      );

      body += section('身体情報',
        row('身長', data.height ? data.height + ' cm' : '') +
        row('体重', data.weight ? data.weight + ' kg' : '') +
        row('姿勢', data.posture) +
        row('既往歴・怪我', data.medicalHistory)
      );

      body += section('目標・要望',
        row('目的', (data.purposes || []).join('、')) +
        row('希望頻度', data.frequency) +
        row('食事管理', data.dietWillingness) +
        row('食事内容', data.dietNotes) +
        row('なりたい姿・目標', data.goal) +
        row('その他要望', data.notes)
      );

      return body;
    }

      html += '<span class="ss-date">' + (data.date || '') + '</span>';
      html += '</div></div>';

      html += infoCard('基本情報',

      html += infoCard('身体情報',

        infoRow('姿勢', data.posture) +

      html += infoCard('目標・要望',

        const available = window.innerHeight - headerH - bottomH - 32;
        const contentH  = capture.scrollHeight;
        if (contentH > available) {

          capture.style.transform = 'scale(' + scale + ')';
          capture.style.marginTop = '16px';

      });

    // =====================================================
    // 📄 カウンセリングシート専用：同じページ内でPDFを自動生成しDriveへアップロード
    // （別タブを開く方式はスプシ保存後のawaitを挟むとポップアップブロックに
    //   引っかかる恐れがあるため、非表示のDOMを使ってこのページ内で完結させる）
    // =====================================================
    async function generateAndUploadPdf(pdfData) {
      if (!window.html2pdf) {
        await new Promise(function(resolve, reject) {
          const s = document.createElement('script');
          s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
          s.onload = resolve;
          s.onerror = function() { reject(new Error('ライブラリ読込失敗')); };
          document.head.appendChild(s);
        });
      }

      const container = document.createElement('div');
      container.style.cssText = 'position:fixed;left:-9999px;top:0;width:750px;background:white;padding:20px 30px;box-sizing:border-box;font-family:Segoe UI,Helvetica Neue,sans-serif;';
      container.innerHTML = pdfData.displayBody;
      document.body.appendChild(container);

      try {
        const blob = await html2pdf().set({
          margin: [10, 15, 10, 15],
          image: { type: 'jpeg', quality: 0.95 },
          html2canvas: {
            scale: 2,
            useCORS: false,
            backgroundColor: '#ffffff',
            scrollX: 0,
            scrollY: 0,
            windowWidth: 794,
            logging: false
          },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
          pagebreak: { mode: ['css', 'legacy'], avoid: ['div'] }
        }).from(container).outputPdf('blob');

        const base64 = await new Promise(function(resolve, reject) {
          const reader = new FileReader();
          reader.onload  = function(e) { resolve(e.target.result.split(',')[1]); };
          reader.onerror = function() { reject(new Error('変換失敗')); };
          reader.readAsDataURL(blob);
        });

        // ★ GASのdoPostはCORSプリフライトに対応していないため、ここは
        //   no-corsでの送信となり、送信自体が成功したかまでしか確認できない
        //   （GAS側での書き込み結果までは確認不可。この制約は既存のトレーニング
        //   PDF保存フローと同じ）
        await fetch(pdfData.scriptURL, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({
            action: pdfData.type === 'counseling' ? 'saveCounselingPDF' : 'savePDFBase64',
            clientName: pdfData.clientName,
            date: pdfData.date,
            pdfBase64: base64
          })
        });
        return true;
      } finally {
        container.remove();
      }
    }

    // ✅ カウンセリングシートを別タブでPDF表示
    function viewCounseling() {
      const data = collectCounseling();
      const displayBody = buildCounselingDisplayBody(data);
      localStorage.setItem('__pdfData', JSON.stringify({
        type: 'counseling', clientName: data.name, date: data.date, displayBody, scriptURL: SCRIPT_URL
      }));
      window.open(location.origin + location.pathname + '?mode=pdf', '_blank');
    }

    // ✅ カウンセリングシートを保存（スプシ保存 → スクリーンショットビュー表示）
    async function saveCounselingToServer() {
      const data = collectCounseling();

      if (!data.name) {
        document.getElementById('driveStatus').textContent = '⚠️ 氏名を入力してください';
        return;
      }
      if (!data.date) {
        document.getElementById('driveStatus').textContent = '⚠️ 実施日を選択してください';
        return;
      }
      if (!checkNameMatch()) {
        return;
      }

      const displayBody = buildCounselingDisplayBody(data);
      const pdfData = { type: 'counseling', clientName: data.name, date: data.date, displayBody, scriptURL: SCRIPT_URL };
      localStorage.setItem('__pdfData', JSON.stringify(pdfData));

      showCounselingScreenshotView(data);

      document.getElementById('driveStatus').textContent = '💾 スプシに保存中...';
      const sheetOk = await postToServer(Object.assign({ action: 'saveCounseling' }, data, { clientName: normalizeKey(data.name) }));

      // ★ スプシ保存が確認できなければ、ここで止めて端末側の下書きは残す
      if (!sheetOk) {
        document.getElementById('driveStatus').textContent = '❌ 保存に失敗しました（入力内容はこの端末に残っています。もう一度「保存」を押してください）';
        return;
      }

      // ★ スプシ保存に成功した時点で、入力欄をクリアする（次のクライアントの氏名や項目が
      //   前の人のデータと混ざって保存されてしまう事故を防ぐため）。PDF生成は
      //   すでに変数pdfDataに保存済みの内容を使うので、クリアしても影響しない
      clearCounselingForm();

      // ★ 続けてPDFを自動生成してGoogleドライブへ保存
      //   （トレーニング記録と違い、カウンセリングシートは「保存」1回でスプシ・Drive両方に保存する仕様）
      document.getElementById('driveStatus').textContent = '📄 PDFを作成してDriveに保存中...';
      let pdfOk = false;
      try {
        pdfOk = await generateAndUploadPdf(pdfData);
      } catch (err) {
        console.error('Counseling PDF error:', err);
      }

      if (pdfOk) {
        document.getElementById('driveStatus').textContent = '✅ スプシ・Driveどちらにも保存しました';
      } else {
        document.getElementById('driveStatus').textContent = '⚠️ スプシには保存済みです。Driveへの保存に失敗しました（入力欄はクリア済みのため、再試行するには入力し直しが必要です）';
      }
      setTimeout(() => { document.getElementById('driveStatus').textContent = '待機中'; }, 6000);
    }

    // ✅ カウンセリングシートの入力欄を空にする（保存完了後、次のクライアント用に使う）
    function clearCounselingForm() {
      document.getElementById('cName').value = '';
      document.getElementById('cBirthYear').value = '';
      document.getElementById('cBirthMonth').value = '';
      document.getElementById('cBirthDay').value = '';
      document.getElementById('cAge').value = '';
      document.getElementById('cGender').value = '';
      document.getElementById('cReferral').value = '';
      document.getElementById('cReferralOther').value = '';
      document.getElementById('cReferralOther').style.display = 'none';
      document.getElementById('cDate').value = '';
      document.getElementById('cHeight').value = '';
      document.getElementById('cWeight').value = '';
      document.getElementById('cPosture').value = '';
      document.getElementById('cMedicalHistory').value = '';
      document.getElementById('cFrequency').value = '';
      document.getElementById('cDietWillingness').value = '';
      document.getElementById('cDietNotes').value = '';
      document.getElementById('cGoal').value = '';
      document.getElementById('cNotes').value = '';
      document.querySelectorAll('#cPurposeGroup input').forEach(function(el) { el.checked = false; });
      localStorage.removeItem('__counselingFormData');
    }

    // =====================================================
    // 🔄 カウンセリングシート：自動保存・復元
    // =====================================================
    let counselingSaveTimer = null;
    function autoSaveCounseling() {
      clearTimeout(counselingSaveTimer);
      counselingSaveTimer = setTimeout(function() {
        localStorage.setItem('__counselingFormData', JSON.stringify(collectCounseling()));
      }, 500);
    }

    function restoreCounseling() {
      const raw = localStorage.getItem('__counselingFormData');
      if (!raw) return;
      try {
        applyCounseling(JSON.parse(raw));
      } catch (e) {
        console.error('Counseling restore error:', e);
      }
    }

    // ✅ 通常モードのみ初期化
    if (!PDF_MODE) {
      document.getElementById('trainerMemo').addEventListener('input', function() {
        const name = document.getElementById('clientName').value.trim();
        if (name) {
          const memo = document.getElementById('trainerMemo').value;
          localStorage.setItem('memo_' + normalizeKey(name), memo);
          scheduleMemoSave(name, memo);
        }
      });

      document.getElementById('clientName').addEventListener('input', function() {
        const name = document.getElementById('clientName').value.trim();
        const normalized = normalizeKey(name);

        if (serverDataCache) {
          const memos = serverDataCache.memos || {};
          let memoVal = '';
          Object.entries(memos).forEach(([k, v]) => {
            if (k.startsWith('memo_') && normalizeKey(k.substring(5)) === normalized) {
              memoVal = v;
            }
          });
          document.getElementById('trainerMemo').value = memoVal || localStorage.getItem('memo_' + normalized) || '';
          if (memoVal) localStorage.setItem('memo_' + normalized, memoVal);

          // ★ 過去のカウンセリング記録（スプシ）があれば、カウンセリングタブに常に上書きで自動反映
          const counselingRecords = serverDataCache.counseling || {};
          const counselingMatch = counselingRecords[normalized];
          if (counselingMatch) {
            applyCounseling(counselingMatch);
          }
        } else {
          document.getElementById('trainerMemo').value = localStorage.getItem('memo_' + normalized) || '';
        }
      });

      if (!restoreForm()) {
        addExercise();
      }

      document.getElementById('mainContainer').addEventListener('input', autoSaveForm);
      document.getElementById('mainContainer').addEventListener('change', autoSaveForm);
      document.getElementById('trainerMemo').addEventListener('input', autoSaveForm);

      loadFromServer();

      if (!localStorage.getItem('__weightsSynced2')) {
        const allWeights = {};
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key.startsWith('record_')) {
            const rest = key.substring(7);
            const lastU = rest.lastIndexOf('_');
            if (lastU > 0) {
              const clientName = rest.substring(0, lastU);
              const exercise = rest.substring(lastU + 1);
              const weight = parseFloat(localStorage.getItem(key));
              if (!isNaN(weight)) {
                if (!allWeights[clientName]) allWeights[clientName] = [];
                allWeights[clientName].push({ exercise, weight });
              }
            }
          }
        }
        const clients = Object.entries(allWeights);
        if (clients.length > 0) {
          document.getElementById('driveStatus').textContent = '📤 重量データ同期中...';
          let sent = 0;
          clients.forEach(([client, weights]) => {
            fetch(SCRIPT_URL, {
              method: 'POST',
              mode: 'no-cors',
              body: JSON.stringify({ action: 'saveWeights', clientName: client, weights })
            }).then(() => {
              sent++;
              if (sent >= clients.length) {
                document.getElementById('driveStatus').textContent = '✅ 重量データ同期完了';
                setTimeout(() => { document.getElementById('driveStatus').textContent = '待機中'; }, 5000);
              }
            }).catch(err => console.error('Weight sync error:', err));
          });
        }
        localStorage.setItem('__weightsSynced2', '1');
      }

      // ===== カウンセリングシート：初期化 =====
      initBirthSelects();
      restoreCounseling();

      document.getElementById('cReferral').addEventListener('change', function() {
        document.getElementById('cReferralOther').style.display = (this.value === 'その他') ? 'block' : 'none';
      });

      document.getElementById('counselingTab').addEventListener('input', autoSaveCounseling);
      document.getElementById('counselingTab').addEventListener('change', autoSaveCounseling);

      document.getElementById('counselingViewModeBtn').addEventListener('click', viewCounseling);

      // ===== 最後に開いていたタブを復元 =====
      const savedTab = localStorage.getItem('__activeTab');
      if (savedTab === 'counseling') {
        switchTab('counseling');
      }
    }
  </script>
</body>
</html>
