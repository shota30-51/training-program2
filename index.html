<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>トレーニングプログラム記録</title>
  <style>
    body {
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
      margin: 0;
      background: white;
      color: #111;
      padding-bottom: 140px;
    }

    .container {
      max-width: 960px;
      margin: auto;
      padding: 30px;
    }

    h1.title {
      background: linear-gradient(to right, #1a237e, #0d47a1);
      color: white;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    /* ===== スプレッドシート同期エリア（左下固定） ===== */
    .drive-section {
      position: fixed;
      bottom: 140px;
      left: 16px;
      background: #f1f8e9;
      border: 1px solid #a5d6a7;
      border-radius: 10px;
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 999;
      box-shadow: 0 2px 8px rgba(0,0,0,0.12);
    }

    .drive-label {
      font-weight: bold;
      color: #33691e;
      font-size: 12px;
      letter-spacing: 0.5px;
    }

    .drive-buttons {
      display: flex;
      justify-content: center;
    }

    #driveSaveBtn {
      background: #2e7d32;
      font-size: 14px;
      padding: 10px 18px;
      margin-top: 0;
    }

    #driveStatus {
      font-size: 11px;
      color: #666;
      text-align: center;
      white-space: nowrap;
    }

    /* ===== 既存スタイル ===== */
    .client-info {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .client-info input {
      flex: 1;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .exercise {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      background-color: #f9f9f9;
      position: relative;
    }

    select.body-part,
    select.exercise-name,
    input.body-part-other {
      padding: 8px 12px;
      font-size: 15px;
      border-radius: 6px;
      border: 1px solid #ccc;
      margin: 5px 5px 5px 0;
      height: 38px;
      vertical-align: middle;
      appearance: none;
      background: white;
    }

    .exercise input[type="number"] {
      padding: 8px;
      font-size: 15px;
      margin: 5px;
      border-radius: 6px;
      border: 1px solid #ccc;
      height: 38px;
      box-sizing: border-box;
    }

    .set-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 10px;
      align-items: center;
    }

    .set-group input {
      flex: 1;
    }

    button {
      padding: 10px 18px;
      font-size: 14px;
      background-color: #0d47a1;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background-color: #1565c0;
    }

    .remove-btn {
      background-color: #b71c1c;
      margin-left: 10px;
    }

    .remove-btn:hover {
      background-color: #c62828;
    }

    #viewModeBtn {
      background-color: #4a148c;
      margin-top: 30px;
    }

    .button-area {
      text-align: center;
    }

    #trainerMemoSection {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #f3f3f3;
      border-top: 2px solid #ccc;
      padding: 8px 10px;
      z-index: 1000;
    }

    #trainerMemoSection textarea {
      width: 100%;
      height: 72px;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 14px;
      border: 1px solid #ccc;
      resize: none;
      transition: height 0.3s ease;
      overflow: auto;
      box-sizing: border-box;
      line-height: 1.5;
    }

    #trainerMemoSection textarea:focus {
      height: 160px;
    }

    .max-weight {
      font-size: 14px;
      color: #2e7d32;
      font-weight: bold;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container" id="mainContainer">
    <h1 class="title">トレーニングプログラム記録</h1>

    <div class="client-info">
      <input type="text" id="clientName" placeholder="クライアント名">
      <input type="date" id="trainingDate">
    </div>
    <div id="exercises"></div>
    <div class="button-area">
      <button onclick="addExercise()">種目を追加</button>
      <button id="viewModeBtn">表示モード（別タブ）</button>
    </div>

    <!-- ===== スプレッドシート同期バー ===== -->
    <div class="drive-section">
      <span class="drive-label">スプレッドシート同期</span>
      <div class="drive-buttons">
        <button id="driveSaveBtn" onclick="saveToServer()">保存</button>
      </div>
      <span id="driveStatus">待機中</span>
    </div>
  </div>

  <div id="trainerMemoSection">
    <strong>トレーナー用メモ欄</strong>
    <textarea id="trainerMemo" placeholder="次回に引き継ぐメモを入力してください"></textarea>
  </div>

  <script>
    // =====================================================
    // ⚙️ Apps Script URL（デプロイ済み）
    // =====================================================
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzqly2OdgCmXrex1XS5ThTPgRIRQaVGNlSQAe3XXXTnQAh-lahSAvHxANMxfny380Dzcg/exec';

    let memoSaveTimer = null;

    // =====================================================
    // PDF表示モード判定（?mode=pdf で別タブから起動）
    // Blob URL・document.write()を使わない iOS 対応方式
    // =====================================================
    const PDF_MODE = new URLSearchParams(location.search).get('mode') === 'pdf';

    // === 表示用HTML生成（データオブジェクトから構築） ===
    function buildDisplayBody(clientName, date, exercisesData) {
      let body = '';
      body += '<h1 style="text-align:center;background:linear-gradient(to right,#1a237e,#0d47a1);color:white;padding:20px;border-radius:8px;font-size:24px;margin:0 0 20px 0;letter-spacing:1px;font-family:Segoe UI,Helvetica Neue,sans-serif;">トレーニングプログラム記録</h1>';
      body += '<div style="display:flex;justify-content:space-between;margin:20px 0;font-size:18px;font-family:Segoe UI,Helvetica Neue,sans-serif;">';
      body += '<div>クライアント名：' + (clientName ? clientName + ' 様' : '') + '</div>';
      body += '<div>日付：' + (date || '') + '</div>';
      body += '</div>';
      exercisesData.forEach(function(ex) {
        body += '<div style="border:1px solid #ccc;padding:20px;border-radius:12px;margin-bottom:20px;background-color:#f9f9f9;font-family:Segoe UI,Helvetica Neue,sans-serif;">';
        body += '<strong>' + ex.part + '：' + ex.name + '</strong><br>';
        (ex.sets || []).forEach(function(s, i) {
          const w = parseFloat(s.weight);
          body += '<div style="margin-left:20px;padding:2px 0;">セット' + (i + 1) + '：' + (isNaN(w) ? '-' : w) + 'kg × ' + (s.reps || '-') + '回</div>';
        });
        if (ex.remarks) {
          body += '<div style="color:#c62828;font-size:15px;white-space:pre-wrap;margin-top:10px;">備考：' + ex.remarks + '</div>';
        }
        body += '</div>';
      });
      return body;
    }

    // ===== PDF表示モード本体 =====
    if (PDF_MODE) {
      const raw = localStorage.getItem('__pdfData');
      if (!raw) {
        document.body.style.cssText = 'font-family:sans-serif;padding:40px;';
        document.body.innerHTML = '<p style="color:red;font-size:18px;">❌ データなし。もう一度保存してください。</p>';
      } else {
        const pdfData = JSON.parse(raw);
        document.body.style.cssText = 'margin:0;padding:0;background:white;font-family:Segoe UI,Helvetica Neue,sans-serif;';
        document.body.innerHTML =
          '<div id="pdfStatus" style="position:fixed;top:20px;right:20px;background:#fff8e1;border:2px solid #ffc107;padding:15px 20px;border-radius:8px;font-weight:bold;color:#e65100;z-index:9999;">📄 PDF生成中... しばらくお待ちください</div>'
          + '<div id="pdfContent" style="padding:40px;">' + pdfData.displayBody + '</div>';

        const st = document.getElementById('pdfStatus');

        (async function runPDF() {
          try {
            // html2pdf.js を読み込み
            await new Promise(function(resolve, reject) {
              const s = document.createElement('script');
              s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
              s.onload  = resolve;
              s.onerror = function() { reject(new Error('ライブラリ読込失敗')); };
              document.head.appendChild(s);
            });

            // PDF生成（pdfStatusを隠してから生成）
            st.style.display = 'none';
            const blob = await html2pdf().set({
              margin: 10,
              image: { type: 'jpeg', quality: 0.95 },
              html2canvas: { scale: 1, useCORS: true, backgroundColor: '#ffffff' },
              jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            }).from(document.getElementById('pdfContent')).outputPdf('blob');

            st.style.display = 'block';
            st.textContent = '📤 アップロード中...';

            // base64変換
            const base64 = await new Promise(function(resolve, reject) {
              const reader = new FileReader();
              reader.onload  = function(e) { resolve(e.target.result.split(',')[1]); };
              reader.onerror = function() { reject(new Error('変換失敗')); };
              reader.readAsDataURL(blob);
            });

            // Google Driveへ送信（no-cors：iOSのCORSプリフライト「Load Failed」を回避）
            await fetch(pdfData.scriptURL, {
              method: 'POST',
              mode: 'no-cors',
              body: JSON.stringify({
                action: 'savePDFBase64',
                clientName: pdfData.clientName,
                date: pdfData.date,
                pdfBase64: base64
              })
            });
            // no-corsのためレスポンスは読めないが送信は完了
            st.textContent = '✅ 保存成功';
            st.style.background    = '#e8f5e9';
            st.style.borderColor   = '#4caf50';
            st.style.color         = '#2e7d32';
          } catch (err) {
            st.style.display       = 'block';
            st.textContent         = '❌ 保存失敗: ' + err.message;
            st.style.background    = '#ffebee';
            st.style.borderColor   = '#f44336';
            st.style.color         = '#c62828';
          }
        })();
      }
    }

    // ✅ メモをスプレッドシートに保存（デバウンス2秒）
    function scheduleMemoSave(clientName, memo) {
      clearTimeout(memoSaveTimer);
      document.getElementById('driveStatus').textContent = '...自動保存準備中';
      memoSaveTimer = setTimeout(async () => {
        await postToServer({ action: 'saveMemo', clientName, memo });
      }, 2000);
    }

    // ✅ 表示モード生成時：トレーニング記録を保存
    async function sendTraining(date, clientName, exercises) {
      await postToServer({ action: 'saveTraining', date, clientName, exercises });
    }

    // ✅ 手動「保存」ボタン：スプシ保存 → PDF表示タブを開く（iOS対応）
    async function saveToServer() {
      const clientName = document.getElementById('clientName').value.trim();
      const date       = document.getElementById('trainingDate').value;
      const memo       = document.getElementById('trainerMemo').value;

      if (!clientName) {
        document.getElementById('driveStatus').textContent = '⚠️ クライアント名を入力してください';
        return;
      }
      if (!date) {
        document.getElementById('driveStatus').textContent = '⚠️ 日付を選択してください';
        return;
      }

      // データ収集・最高重量更新・localStorage書き込み（await前に実行）
      const exercisesData = collectExercises();
      updateMaxWeights(clientName, exercisesData);
      const displayBody = buildDisplayBody(clientName, date, exercisesData);
      localStorage.setItem('__pdfData', JSON.stringify({
        clientName, date, displayBody, scriptURL: SCRIPT_URL
      }));

      // ★ await前（ユーザー操作の直後）にウィンドウを開く → iOS ポップアップブロック回避 ★
      window.open(location.origin + location.pathname + '?mode=pdf', '_blank');

      document.getElementById('driveStatus').textContent = '💾 スプシに保存中...';

      // メモをスプシに保存
      if (memo) {
        await postToServer({ action: 'saveMemo', clientName, memo });
      }
      // 種目データをスプシに保存
      if (exercisesData.length > 0) {
        await postToServer({ action: 'saveTraining', date, clientName, exercises: exercisesData });
      }

      document.getElementById('driveStatus').textContent = '✅ 保存成功';
    }

    // ✅ 種目の最高重量をlocalStorageに記録
    function updateMaxWeights(clientName, exercisesData) {
      exercisesData.forEach(function(ex) {
        const weights = (ex.sets || []).map(function(s) { return parseFloat(s.weight); }).filter(function(w) { return !isNaN(w); });
        if (weights.length > 0 && clientName && ex.name) {
          const maxWeight = Math.max.apply(null, weights);
          const key  = 'record_' + clientName + '_' + ex.name;
          const prev = parseFloat(localStorage.getItem(key));
          if (!prev || maxWeight > prev) localStorage.setItem(key, maxWeight);
        }
      });
    }

    // ✅ 共通送信関数（GET + no-cors でURLパラメータ送信）
    async function postToServer(payload) {
      try {
        const url = SCRIPT_URL + '?payload=' + encodeURIComponent(JSON.stringify(payload));
        await fetch(url, { mode: 'no-cors' });
        const now = new Date().toLocaleTimeString('ja-JP');
        document.getElementById('driveStatus').textContent = `✅ 保存成功 ${now}`;
      } catch(err) {
        console.error('Save error:', err);
        document.getElementById('driveStatus').textContent = '❌ 保存失敗';
      }
    }

    // ✅ スプレッドシートからデータ読み込み
    async function loadFromServer() {
      document.getElementById('driveStatus').textContent = '📂 読み込み中...';
      try {
        const res  = await fetch(SCRIPT_URL);
        const data = await res.json();

        let count = 0;
        Object.entries(data.memos   || {}).forEach(([k, v]) => { localStorage.setItem(k, v); count++; });
        Object.entries(data.weights || {}).forEach(([k, v]) => { localStorage.setItem(k, v); count++; });

        const now = new Date().toLocaleTimeString('ja-JP');
        document.getElementById('driveStatus').textContent = `✅ ${count}件読み込み完了 ${now}`;

        // クライアント名が入力済みならメモを即反映
        const clientName = document.getElementById('clientName').value.trim();
        if (clientName) {
          document.getElementById('trainerMemo').value =
            localStorage.getItem('memo_' + clientName) || '';
        }
      } catch(err) {
        console.error('Load error:', err);
        document.getElementById('driveStatus').textContent = '❌ 読み込み失敗';
      }
    }

    // ✅ 画面上の種目データを収集
    function collectExercises() {
      const result = [];
      document.querySelectorAll('.exercise').forEach(ex => {
        const part         = ex.querySelector('.body-part').value;
        const partOther    = ex.querySelector('.body-part-other');
        const partName     = part === 'その他' ? partOther.value : part;
        const exerciseName = ex.querySelector('.exercise-name').value;
        const remarks      = ex.querySelector('textarea[placeholder="備考"]').value;
        const setsData     = [];

        ex.querySelectorAll('.set-group').forEach(s => {
          setsData.push({
            weight: s.querySelector('input[placeholder="重量(kg)"]').value,
            reps:   s.querySelector('input[placeholder="回数"]').value
          });
        });

        if (partName && exerciseName) {
          result.push({ part: partName, name: exerciseName, remarks, sets: setsData });
        }
      });
      return result;
    }

    // =====================================================
    // 種目データ
    // =====================================================
    const exerciseOptions = {
      "胸": ["ベンチプレス", "インクラインベンチプレス", "デクラインベンチプレス", "ダンベルプレス", "インクラインダンベルプレス", "デクラインダンベルプレス", "ケーブルクロスオーバー", "プッシュアップ", "ダンベルフライ", "ペックフライ", "チェストプレス", "プルオーバー", "ケーブルフライ", "ディップス"],
      "肩": ["ショルダープレス", "バーベルショルダープレス","ミリタリープレス", "スミスショルダープレス","サイドレイズ","フロントレイズ", "リアレイズ", "アップライトロウ", "フェイスプル", "リアデルト", "アーノルドプレス", "ダンベルショルダープレス", "ケーブルサイドレイズ", "オーバーヘッドプレス", "リアデルトフライ", "インナーマッスルトレーニング"],
      "背中": ["ラットプルダウン","チューブローイング", "シーテッドロー", "ベントオーバーロー", "デッドリフト", "チンニング", "ケーブルロー", "ロー・ロー", "ワンハンドダンベルロー", "ダンベルプルオーバー", "ケーブルプルオーバー", "ダンベルロー", "Yレイズ", "アシスト・チン"],
      "腕": ["アームカール", "トライセプスエクステンション", "スカルクラッシャー","ハンマーカール", "プリーチャーカール", "キックバック", "フレンチプレス", "ダンベルカール", "バーベルカール", "ケーブルプレスダウン", "EZバーカール"],
      "脚": ["スクワット", "レッグプレス", "レッグエクステンション", "レッグカール", "カーフレイズ", "ランジ", "ブルガリアンスクワット", "ルーマニアンデッドリフト", "グルートキック", "スミスマシンスクワット", "45度レッグプレス", "アダクション","ゴブレットスクワット"],
      "お尻": ["ヒップスラスト", "ヒップリフト","シェル","ヒップアブダクション", "グルートキック", "レッグプレス", "スクワット", "ブルガリアンスクワット", "ルーマニアンデッドリフト","ランジスクワット","ランジ"],
      "体幹": ["プランク", "クランチ", "レッグレイズ", "サイドプランク", "アブローラー", "サイドベンド"]
    };

    function addExercise() {
      const exerciseContainer = document.getElementById('exercises');
      const exercise = document.createElement('div');
      exercise.className = 'exercise';

      const bodyPartSelect = document.createElement('select');
      bodyPartSelect.className = 'body-part';
      bodyPartSelect.innerHTML = `<option value="" disabled selected>部位を選択</option>` +
        Object.keys(exerciseOptions).map(part => `<option value="${part}">${part}</option>`).join('') +
        `<option value="その他">その他</option>`;

      const bodyPartInput = document.createElement('input');
      bodyPartInput.type = 'text';
      bodyPartInput.placeholder = '自由入力（部位）';
      bodyPartInput.className = 'body-part-other';
      bodyPartInput.style.display = 'none';

      const exerciseSelect = document.createElement('select');
      exerciseSelect.className = 'exercise-name';
      exerciseSelect.innerHTML = '<option value="" disabled selected>種目を選択</option>';

      const maxWeightDisplay = document.createElement('div');
      maxWeightDisplay.className = 'max-weight';

      bodyPartSelect.addEventListener('change', () => {
        const selectedPart = bodyPartSelect.value;
        if (selectedPart === 'その他') {
          bodyPartInput.style.display = 'inline-block';
          exerciseSelect.innerHTML = '<option value="" disabled selected>種目を選択</option>';
        } else {
          bodyPartInput.style.display = 'none';
          const options = exerciseOptions[selectedPart] || [];
          exerciseSelect.innerHTML = '<option value="" disabled selected>種目を選択</option>' +
            options.map(name => `<option value="${name}">${name}</option>`).join('');
        }
      });

      exerciseSelect.addEventListener('change', () => {
        const clientName = document.getElementById('clientName').value.trim();
        const selectedExercise = exerciseSelect.value;
        if (!clientName || !selectedExercise) return;
        const key = `record_${clientName}_${selectedExercise}`;
        const maxWeight = localStorage.getItem(key);
        maxWeightDisplay.textContent = maxWeight
          ? `過去最高重量：${maxWeight} kg`
          : '過去記録なし';
      });

      const setsDiv = document.createElement('div');
      setsDiv.className = 'sets';
      const setGroup = document.createElement('div');
      setGroup.className = 'set-group';
      setGroup.innerHTML = `
        <input type="number" step="0.1" placeholder="重量(kg)">
        <input type="number" step="1" placeholder="回数">
        <button class="remove-btn" onclick="removeSet(this)">セット削除</button>
      `;
      setsDiv.appendChild(setGroup);

      const remarks = document.createElement('textarea');
      remarks.placeholder = '備考';
      remarks.style.cssText = 'width:100%;height:60px;border-radius:6px;padding:8px;border:1px solid #ccc;font-size:15px;';

      exercise.appendChild(bodyPartSelect);
      exercise.appendChild(bodyPartInput);
      exercise.appendChild(exerciseSelect);
      exercise.appendChild(maxWeightDisplay);
      exercise.appendChild(document.createElement('br'));
      exercise.appendChild(setsDiv);

      const addSetBtn = document.createElement('button');
      addSetBtn.textContent = 'セットを追加';
      addSetBtn.onclick = () => addSet(addSetBtn);
      exercise.appendChild(addSetBtn);

      const removeExerciseBtn = document.createElement('button');
      removeExerciseBtn.textContent = '種目削除';
      removeExerciseBtn.className = 'remove-btn';
      removeExerciseBtn.onclick = () => removeExercise(removeExerciseBtn);
      exercise.appendChild(removeExerciseBtn);

      exercise.appendChild(document.createElement('br'));
      exercise.appendChild(document.createElement('br'));
      exercise.appendChild(remarks);
      exerciseContainer.appendChild(exercise);
    }

    function addSet(button) {
      const setsContainer = button.previousElementSibling;
      const newSet = document.createElement('div');
      newSet.className = 'set-group';
      newSet.innerHTML = `
        <input type="number" step="0.1" placeholder="重量(kg)">
        <input type="number" step="1" placeholder="回数">
        <button class="remove-btn" onclick="removeSet(this)">セット削除</button>
      `;
      setsContainer.appendChild(newSet);
    }

    function removeExercise(button) { button.closest('.exercise').remove(); }
    function removeSet(button)      { button.closest('.set-group').remove(); }

    // ✅ 通常モードのみ初期化（PDF表示モードでは不要）
    if (!PDF_MODE) {
      // 表示モードボタン：?mode=pdf タブを開く（localStorage経由でデータ渡し）
      document.getElementById('viewModeBtn').addEventListener('click', function() {
        const clientName    = document.getElementById('clientName').value.trim();
        const date          = document.getElementById('trainingDate').value;
        const exercisesData = collectExercises();

        // 過去最高重量を更新
        updateMaxWeights(clientName, exercisesData);

        // データをlocalStorageに書き込んでから新タブを開く
        const displayBody = buildDisplayBody(clientName, date, exercisesData);
        localStorage.setItem('__pdfData', JSON.stringify({
          clientName, date, displayBody, scriptURL: SCRIPT_URL
        }));
        window.open(location.origin + location.pathname + '?mode=pdf', '_blank');
      });

      // メモ入力 → 2秒後に自動保存
      document.getElementById('trainerMemo').addEventListener('input', function() {
        const name = document.getElementById('clientName').value.trim();
        if (name) {
          const memo = document.getElementById('trainerMemo').value;
          localStorage.setItem('memo_' + name, memo);
          scheduleMemoSave(name, memo);
        }
      });

      document.getElementById('clientName').addEventListener('input', function() {
        const name = document.getElementById('clientName').value;
        document.getElementById('trainerMemo').value = localStorage.getItem('memo_' + name) || '';
      });

      addExercise();

      // ページ読み込み時にスプシから自動取得
      loadFromServer();
    }
  </script>
</body>
</html>
